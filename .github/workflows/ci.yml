name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version is intentionally NOT set here: pnpm/action-setup@v4 errors if a
      # version is given both here and via package.json's "packageManager"
      # field. The pinned "pnpm@9.15.4" in package.json is the single source of
      # truth.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run turbo pipeline
        run: pnpm turbo run test lint typecheck

  e2e:
    name: Playwright critical path
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sectoria_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sectoria_e2e
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_SECRET: e2e-ci-auth-secret-minimum-32-chars!!
      AUTH_URL: http://localhost:3000
      E2E_TEST: "1"
      CI: true
      FEATURE_LEGACY_SELF_SERVE_BOOKING: "false"
      FEATURE_PUBLIC_DEALER_DIRECTORY: "false"
      FEATURE_LEGACY_SOCIETY_BOOKING_QUEUE: "false"
      ESCROW_WEBHOOK_SECRET: e2e-ci-escrow-webhook-secret-min-32-chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @sectoria/database exec prisma generate

      - name: Prepare E2E database
        run: |
          pnpm --filter @sectoria/database exec prisma migrate deploy
          pnpm --filter @sectoria/database exec prisma db seed

      - name: Run Playwright E2E suite
        run: pnpm test:e2e
        env:
          E2E_SKIP_DB_SETUP: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
